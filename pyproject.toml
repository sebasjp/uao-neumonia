[project]
name = "uao-neumonia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.13,<3.14"
dependencies = [
    "img2pdf>=0.6.3",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "pydicom>=3.0.2",
    "python-xlib<0.33",
    "tensorflow>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# D100-D107: exige docstring en módulos/clases/funciones/métodos públicos.
# D417: exige documentar cada parámetro declarado en la firma (Args:).
# Ver AGENTS.md#estilo-de-código.
extend-select = ["D100", "D101", "D102", "D103", "D104", "D106", "D107", "D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# En test/ los docstrings no son obligatorios: el nombre del test ya documenta el caso.
"test/**" = ["D"]
