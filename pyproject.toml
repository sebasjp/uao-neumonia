[project]
name = "uao-neumonia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12,<3.14"
dependencies = [
    "img2pdf>=0.6.3",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "pyautogui>=0.9.54",
    "pydicom>=3.0.2",
    "python-xlib>=0.33",
    "streamlit>=1.62.0",
    "tensorflow>=2.21.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
link-mode = "copy"
