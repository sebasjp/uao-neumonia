[project]
name = "uao-neumonia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cesar Carabali", email = "cesaryagami001@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "img2pdf>=0.6.3",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pyautogui>=0.9.54",
    "pydicom>=3.0.2",
    "python-xlib>=0.33",
    "tensorflow>=2.21.0",
    "tkcap>=0.0.4",
]

[project.scripts]
uao-neumonia = "uao_neumonia:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
